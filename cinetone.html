<!DOCTYPE html>
<html lang="en" data-theme="light">

<title>Cinetone – rate films and their soundtracks</title>
<style>

.hero .ph{font-size:20px}img.ph{width:100%;display:block;object-fit:cover;padding:0}

.b0{background:#7a2a3d}.b1{background:#d9534f}.b2{background:#e0a43a}.b3{background:#3fb28a}.b4{background:var(--ac)}

.big{font-size:34px;font-weight:700;letter-spacing:-.02em}

#chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}#chat input{flex:1;min-width:0}
footer{text-align:center;padding:24px;color:var(--mu);font-size:12px}
</style>
</head>
<body>
<header>
